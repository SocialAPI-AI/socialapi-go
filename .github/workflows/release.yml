name: Release

# The api repo's CI commits openapi.json on every api release tag. This
# workflow regenerates the SDK from it, runs the tests, and releases when the
# package changed. For Go the release is the tag itself.
on:
  push:
    branches: [main]
    paths: [openapi.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  FIRST_VERSION: 0.1.0
  OASDIFF_VERSION: 1.38.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install oasdiff
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin oasdiff

      - name: Generate
        run: bash scripts/generate.sh

      - name: Build and test
        run: |
          go vet ./...
          go test ./...

      - name: Next version
        id: version
        run: |
          version=$(bash scripts/next-version.sh "$FIRST_VERSION" '*.go' go.mod go.sum) # an assignment, so a script error fails the step
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # With PUBLISH off nothing is tagged, since a Go tag is itself a release.
      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ vars.PUBLISH }}
        run: bash scripts/commit-release.sh

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report-failure.sh
